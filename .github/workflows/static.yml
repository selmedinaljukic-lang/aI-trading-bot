
name: Deploy AL Trading Bot

on:
  push:
    branches: ["main"]
  workflow_dispatch:
  schedule:
    - cron: "0 2 * * 1-5"

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Fetch Massive stock prices
        env:
          MASSIVE_API_KEY: ${{ secrets.MASSIVE_API_KEY }}
        run: |
          python3 <<'PY'
          import os, json, time, urllib.request, urllib.parse
          from datetime import datetime, timezone

          key = os.environ.get("MASSIVE_API_KEY")
          if not key:
              raise SystemExit("Missing MASSIVE_API_KEY secret")

          tickers = ["AAPL", "MSFT", "NVDA", "TSLA"]
          prices = {}

          for i, ticker in enumerate(tickers):
              if i:
                  time.sleep(13)

              params = urllib.parse.urlencode({
                  "adjusted": "true",
                  "apiKey": key
              })

              url = (
                  f"https://api.massive.com/v2/aggs/"
                  f"ticker/{ticker}/prev?{params}"
              )

              request = urllib.request.Request(url)
              with urllib.request.urlopen(request, timeout=30) as response:
                  data = json.loads(response.read())

              if data.get("status") != "OK" or not data.get("results"):
                  raise SystemExit(f"No market data for {ticker}")

              bar = data["results"][0]

              prices[ticker] = {
                  "open": bar["o"],
                  "high": bar["h"],
                  "low": bar["l"],
                  "close": bar["c"],
                  "volume": bar["v"],
                  "timestamp": bar["t"]
              }

          output = {
              "source": "Massive",
              "updated_at": datetime.now(timezone.utc).isoformat(),
              "prices": prices
          }

          with open("prices.json", "w") as file:
              json.dump(output, file, indent=2)

          print("Market data downloaded successfully.")
          PY

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: .

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
