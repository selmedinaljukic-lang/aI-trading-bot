
name: Deploy AL Trading Bot

on:
  push:
    branches: ["main"]
  workflow_dispatch:
  schedule:
    - cron: "0 2 * * 1-5"

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Fetch Massive historical stock prices
        env:
          MASSIVE_API_KEY: ${{ secrets.MASSIVE_API_KEY }}
        run: |
          python3 <<'PY'
          import os, json, time, urllib.request, urllib.parse
          from datetime import datetime, timezone, timedelta

          key = os.environ.get("MASSIVE_API_KEY")
          if not key:
              raise SystemExit("Missing MASSIVE_API_KEY secret")

          tickers = ["AAPL", "MSFT", "NVDA", "TSLA"]
          stocks = {}

          end_date = datetime.now(timezone.utc).date() - timedelta(days=1)
          start_date = end_date - timedelta(days=120)

          for i, ticker in enumerate(tickers):
              if i:
                  time.sleep(13)

              params = urllib.parse.urlencode({
                  "adjusted": "true",
                  "sort": "asc",
                  "limit": 50000,
                  "apiKey": key
              })

              url = (
                  f"https://api.massive.com/v2/aggs/ticker/"
                  f"{ticker}/range/1/day/"
                  f"{start_date}/{end_date}?{params}"
              )

              request = urllib.request.Request(url)
              with urllib.request.urlopen(request, timeout=30) as response:
                  data = json.loads(response.read())

              if data.get("status") not in ("OK", "DELAYED") or not data.get("results"):
                  raise SystemExit(f"No historical data for {ticker}: {data}")

              bars = data["results"][-60:]
              latest = bars[-1]

              stocks[ticker] = {
                  "open": latest["o"],
                  "high": latest["h"],
                  "low": latest["l"],
                  "close": latest["c"],
                  "volume": latest["v"],
                  "timestamp": latest["t"],
                  "history": [
                      {
                          "close": bar["c"],
                          "timestamp": bar["t"]
                      }
                      for bar in bars
                  ]
              }

              print(f"{ticker}: downloaded {len(bars)} daily prices")

          output = {
              "source": "Massive",
              "updated_at": datetime.now(timezone.utc).isoformat(),
              "prices": stocks
          }

          with open("prices.json", "w") as file:
              json.dump(output, file, indent=2)

          print("Historical market data downloaded successfully.")
          PY

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: .

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
